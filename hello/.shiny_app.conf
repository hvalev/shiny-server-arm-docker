# Per-app configuration for the hello app.
#
# shiny-server reads this file (the name matters: .shiny_app.conf, with an
# underscore) from the app's root directory and applies it on top of the
# site-wide configuration, provided allow_app_override is enabled in the
# server config (it is, in our shiny-server.conf).
#
# Only application-scope directives are honoured in this file (e.g.
# app_init_timeout, app_idle_timeout, frame_options); a parse error makes
# the app fail, so keep it minimal. The long timeouts let R cold-start this
# app on slow devices without shiny-server killing the first request.
app_init_timeout 1800;
app_idle_timeout 1800;
