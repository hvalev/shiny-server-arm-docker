name: build
on:
  push:
    tags:
      - 'R*-S*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildx:
    runs-on: self-hosted
    timeout-minutes: 4320
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          # persistent builder: keeps the buildkit cache warm between runs
          name: shiny-builder
          cleanup: false
          use: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUBUNAME }}
          password: ${{ secrets.DOCKERHUBTOKEN }}

      - name: Build and push shiny
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: shiny-builder
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          target: shiny
          push: true
          tags: |
            hvalev/shiny-server-arm:${{ github.ref_name }}
            hvalev/shiny-server-arm:latest
          cache-from: type=registry,ref=hvalev/shiny-server-buildcache:latest
          cache-to: type=registry,ref=hvalev/shiny-server-buildcache:latest,mode=max

      - name: Build and push shiny with devtools
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: shiny-builder
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          target: shiny-with-devtools
          push: true
          tags: |
            hvalev/shiny-server-arm:devtools-${{ github.ref_name }}
            hvalev/shiny-server-arm:devtools-latest
          cache-from: type=registry,ref=hvalev/shiny-server-buildcache:latest
          cache-to: type=registry,ref=hvalev/shiny-server-buildcache:latest,mode=max

      - name: Smoke test published image
        run: |
          set -uo pipefail
          # Pull what we just published and verify the amd64 platform serves the hello app
          docker pull --platform linux/amd64 hvalev/shiny-server-arm:latest
          docker rm -f shiny-smoke-test >/dev/null 2>&1 || true
          docker run -d --name shiny-smoke-test hvalev/shiny-server-arm:latest

          # DooD: talk to the app through the container's bridge IP
          IP=""
          for i in $(seq 1 30); do
            IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' shiny-smoke-test 2>/dev/null || true)
            [ -n "$IP" ] && break
            sleep 2
          done
          if [ -z "$IP" ]; then
            echo "smoke test failed: container did not get an IP"
            docker logs --tail 50 shiny-smoke-test || true
            exit 1
          fi
          echo "container IP: $IP"

          ok=0
          for i in $(seq 1 90); do
            if curl -sf "http://$IP:3838/hello/" -o /tmp/smoke-hello.html; then
              ok=1
              break
            fi
            sleep 5
          done

          docker logs --tail 50 shiny-smoke-test || true

          if [ "$ok" -ne 1 ]; then
            echo "smoke test failed: /hello/ never responded"
            exit 1
          fi
          if grep -qi "It's Alive" /tmp/smoke-hello.html; then
            echo "smoke test passed: published image serves the hello app"
          else
            echo "smoke test failed: unexpected response from /hello/"
            head -c 2000 /tmp/smoke-hello.html
            exit 1
          fi
          docker rm -f shiny-smoke-test >/dev/null

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUBUNAME }}
          password: ${{ secrets.DOCKERHUBPWD }}
          repository: hvalev/shiny-server-arm
