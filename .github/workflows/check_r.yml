name: Check R Version

on:
  schedule:
    - cron: '0 4 * * 6'

jobs:
  updateR:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install libs
        run: sudo apt-get update && sudo apt-get install curl jq -y

      - name: Get Latest R Release
        id: r-version
        run: |
          # CRAN only serves the current release at the /src/base/R-latest.*
          # alias; VERSION-INFO.dcf is the authoritative version marker.
          RELEASE_TAG=$(curl -fsSL https://cran.r-project.org/src/base/VERSION-INFO.dcf | awk '/^Release:/{print $2}')
          if [ -z "$RELEASE_TAG" ]; then echo "failed to determine latest R release"; exit 1; fi
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "current_tag=$(tr -d '[:space:]' < R-version.txt)" >> $GITHUB_OUTPUT
          echo "Latest R: $RELEASE_TAG (current: $(cat R-version.txt))"

      - name: Update R-version.txt
        if: steps.r-version.outputs.current_tag != steps.r-version.outputs.release_tag
        run: |
          # Update current release
          echo "${{ steps.r-version.outputs.release_tag }}" > R-version.txt

      - name: Update Readme.md & Dockerfile
        if: steps.r-version.outputs.current_tag != steps.r-version.outputs.release_tag
        uses: jacobtomlinson/gha-find-replace@3.0.5
        with:
          find: ${{ steps.r-version.outputs.current_tag }}
          replace: ${{ steps.r-version.outputs.release_tag }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: Update R to ${{ steps.r-version.outputs.release_tag }}
          title: Update R to ${{ steps.r-version.outputs.release_tag }}
          body: |
            Updates [r-version][1] to ${{ steps.r-version.outputs.release_tag }}
            Auto-generated by [create-pull-request][2]
            [1]: https://cran.r-project.org/src/base/VERSION-INFO.dcf
            [2]: https://github.com/peter-evans/create-pull-request
          labels: dependencies, automated pr
          branch: R-updates
          token: ${{ secrets.REPO_SCOPED_TOKEN }}
