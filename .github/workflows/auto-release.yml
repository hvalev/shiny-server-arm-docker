name: Auto Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'R-version.txt'
      - 'Shiny-version.txt'
      # base-image bumps must rebuild the published image, not just the repo
      - 'Dockerfile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A tag pushed with GITHUB_TOKEN never chain-triggers build.yml, so
          # the release would sit untagged-but-unbuilt; push it as a PAT.
          token: ${{ secrets.REPO_SCOPED_TOKEN }}

      - name: Read Versions
        id: versions
        run: |
          R_VERSION=$(cat R-version.txt | tr -d '[:space:]')
          SHINY_VERSION=$(cat Shiny-version.txt | tr -d '[:space:]')
          echo "r_version=$R_VERSION" >> $GITHUB_OUTPUT
          echo "shiny_version=$SHINY_VERSION" >> $GITHUB_OUTPUT
          echo "tag=R${R_VERSION}-S${SHINY_VERSION}" >> $GITHUB_OUTPUT
          echo "R Version: $R_VERSION"
          echo "Shiny Version: $SHINY_VERSION"
          echo "Tag: R${R_VERSION}-S${SHINY_VERSION}"

      - name: Resolve release tag
        id: rel
        env:
          BASE: ${{ steps.versions.outputs.tag }}
        run: |
          # A base-image bump leaves R and Shiny unchanged, so the plain tag
          # is taken by the previous release. Rebuilds get a -rN suffix; the
          # build workflow matches the R*-S* glob either way.
          TAG="$BASE"
          if git rev-parse "$BASE" >/dev/null 2>&1; then
            n=2
            while git rev-parse "$BASE-r$n" >/dev/null 2>&1; do
              n=$((n + 1))
            done
            TAG="$BASE-r$n"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Create Tag
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Release ${{ steps.rel.outputs.tag }}
          body: |
            ## Changes
            - R Version: ${{ steps.versions.outputs.r_version }}
            - Shiny Server Version: ${{ steps.versions.outputs.shiny_version }}

            ## Docker Images
            - `hvalev/shiny-server-arm:${{ steps.rel.outputs.tag }}`
            - `hvalev/shiny-server-arm:latest`
            - `hvalev/shiny-server-arm:devtools-${{ steps.rel.outputs.tag }}`
            - `hvalev/shiny-server-arm:devtools-latest`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
