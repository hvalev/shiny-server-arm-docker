name: Auto Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'R-version.txt'
      - 'Shiny-version.txt'
      # base-image bumps must rebuild the published image, not just the repo
      - 'Dockerfile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # the confirmation step lists workflow runs; an explicit permissions
      # block makes everything else 'none', and without this the query is
      # refused with 403
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A tag pushed with GITHUB_TOKEN never chain-triggers build.yml, so
          # the release would sit untagged-but-unbuilt; push it as a PAT.
          token: ${{ secrets.REPO_SCOPED_TOKEN }}

      - name: Read Versions
        id: versions
        run: |
          R_VERSION=$(cat R-version.txt | tr -d '[:space:]')
          SHINY_VERSION=$(cat Shiny-version.txt | tr -d '[:space:]')
          echo "r_version=$R_VERSION" >> $GITHUB_OUTPUT
          echo "shiny_version=$SHINY_VERSION" >> $GITHUB_OUTPUT
          echo "tag=R${R_VERSION}-S${SHINY_VERSION}" >> $GITHUB_OUTPUT
          echo "R Version: $R_VERSION"
          echo "Shiny Version: $SHINY_VERSION"
          echo "Tag: R${R_VERSION}-S${SHINY_VERSION}"

      - name: Resolve release tag
        id: rel
        env:
          BASE: ${{ steps.versions.outputs.tag }}
        run: |
          # A base-image bump leaves R and Shiny unchanged, so the plain tag
          # is taken by the previous release. Rebuilds get a -rN suffix; the
          # build workflow matches the R*-S* glob either way.
          TAG="$BASE"
          if git rev-parse "$BASE" >/dev/null 2>&1; then
            n=2
            while git rev-parse "$BASE-r$n" >/dev/null 2>&1; do
              n=$((n + 1))
            done
            TAG="$BASE-r$n"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Create Tag
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Release ${{ steps.rel.outputs.tag }}
          body: |
            ## Changes
            - R Version: ${{ steps.versions.outputs.r_version }}
            - Shiny Server Version: ${{ steps.versions.outputs.shiny_version }}

            ## Docker Images
            - `hvalev/shiny-server-arm:${{ steps.rel.outputs.tag }}`
            - `hvalev/shiny-server-arm:latest`
            - `hvalev/shiny-server-arm:devtools-${{ steps.rel.outputs.tag }}`
            - `hvalev/shiny-server-arm:devtools-latest`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the tag scheduled a build
        env:
          # read-only lookup, so the job token is enough; keeping it off the
          # PAT means an expired REPO_SCOPED_TOKEN cannot fake a missing build
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          EP: repos/${{ github.repository }}/actions/workflows/build.yml/runs
        run: |
          # build.yml fires on the tag push made above. A push authenticated as
          # GITHUB_TOKEN, or a REPO_SCOPED_TOKEN that expired or lost its scope,
          # is still accepted by git and leaves a release with no image.
          # A queued run counts: the one self-hosted runner means a build often
          # waits hours for a slot, and it is listed the moment it is created.
          SHA=$(git rev-list -1 "$TAG")
          for i in $(seq 1 30); do
            # a failed query is a permissions problem, not a missing build, and
            # reporting it as one called two good releases broken
            if ! resp=$(gh api "$EP" -f head_sha="$SHA" 2>&1); then
              echo "::error::cannot list build.yml runs for $SHA: $resp"
              exit 1
            fi
            n=$(printf '%s' "$resp" | jq -r '.total_count // 0')
            if [ "${n:-0}" -gt 0 ]; then
              echo "build.yml scheduled for $TAG ($n run(s))"
              exit 0
            fi
            sleep 10
          done
          echo "::error::no build run scheduled for $TAG ($SHA) after 5 min;" \
            "the tag push did not chain-trigger build.yml."
          exit 1
