name: ci
on:
  push:
    paths-ignore:
      - 'README.md'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - 'README.md'
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 4320
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          # persistent builder: the buildkit container (and its local cache)
          # survives between runs on this runner, which keeps the qemu
          # cross-builds fast (runners/cleanup.sh prunes stale cache daily)
          name: shiny-builder
          cleanup: false
          use: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUBUNAME }}
          password: ${{ secrets.DOCKERHUBTOKEN }}

      - name: Build shiny (all platforms)
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: shiny-builder
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          target: shiny
          cache-from: type=registry,ref=hvalev/shiny-server-buildcache:latest
          cache-to: type=registry,ref=hvalev/shiny-server-buildcache:latest,mode=max

      - name: Build shiny with devtools (all platforms)
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: shiny-builder
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          target: shiny-with-devtools
          cache-from: type=registry,ref=hvalev/shiny-server-buildcache:latest
          cache-to: type=registry,ref=hvalev/shiny-server-buildcache:latest,mode=max

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: shiny-builder
          platforms: linux/amd64
          target: shiny
          load: true
          tags: hvalev/shiny-server-arm:ci-smoke
          cache-from: type=registry,ref=hvalev/shiny-server-buildcache:latest

      - name: Smoke test
        run: |
          set -uo pipefail
          docker rm -f shiny-smoke-test >/dev/null 2>&1 || true
          docker run -d --name shiny-smoke-test hvalev/shiny-server-arm:ci-smoke

          # DooD: ports are published on the host, not in this runner container,
          # so talk to the app through the container's bridge IP instead.
          IP=""
          for i in $(seq 1 30); do
            IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' shiny-smoke-test 2>/dev/null || true)
            [ -n "$IP" ] && break
            sleep 2
          done
          if [ -z "$IP" ]; then
            echo "smoke test failed: container did not get an IP"
            docker logs --tail 50 shiny-smoke-test || true
            exit 1
          fi
          echo "container IP: $IP"

          ok=0
          for i in $(seq 1 90); do
            if curl -sf "http://$IP:3838/hello/" -o /tmp/smoke-hello.html; then
              ok=1
              break
            fi
            sleep 5
          done

          docker logs --tail 50 shiny-smoke-test || true

          if [ "$ok" -ne 1 ]; then
            echo "smoke test failed: /hello/ never responded"
            exit 1
          fi
          if grep -qi "It's Alive" /tmp/smoke-hello.html; then
            echo "smoke test passed: hello app is serving the expected page"
          else
            echo "smoke test failed: unexpected response from /hello/"
            head -c 2000 /tmp/smoke-hello.html
            exit 1
          fi
          docker rm -f shiny-smoke-test >/dev/null
