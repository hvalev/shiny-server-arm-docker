name: ci
on:
  push:
    paths-ignore:
      - 'README.md'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - 'README.md'
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 4320
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          # persistent builder: the buildkit container (and its local cache)
          # survives between runs on this runner, which keeps the qemu
          # cross-builds fast (runners/cleanup.sh prunes stale cache daily)
          name: shiny-builder
          cleanup: false
          use: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUBUNAME }}
          password: ${{ secrets.DOCKERHUBTOKEN }}

      - name: Build shiny (all platforms)
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: shiny-builder
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          target: shiny
          cache-from: type=registry,ref=hvalev/shiny-server-buildcache:latest
          cache-to: type=registry,ref=hvalev/shiny-server-buildcache:latest,mode=max

      - name: Build shiny with devtools (all platforms)
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: shiny-builder
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          target: shiny-with-devtools
          cache-from: type=registry,ref=hvalev/shiny-server-buildcache:latest
          cache-to: type=registry,ref=hvalev/shiny-server-buildcache:latest,mode=max

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: shiny-builder
          platforms: linux/amd64
          target: shiny
          load: true
          tags: hvalev/shiny-server-arm:ci-smoke
          cache-from: type=registry,ref=hvalev/shiny-server-buildcache:latest

      - name: Smoke test
        run: |
          set -uo pipefail
          # DooD: the runner container shares the host docker socket, so -p
          # ports land on the host (unreachable from here). This host also
          # drops traffic between separate docker bridges, so put the smoke
          # container on the runner's own network and talk to it by name via
          # docker's built-in DNS (the runner container name is fixed by the
          # runner's compose setup; fall back to bridge IP if unknown).
          RUNNER_NET=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' gh-runner-shiny 2>/dev/null | awk '{print $1}')
          docker rm -f shiny-smoke-test >/dev/null 2>&1 || true
          if [ -n "$RUNNER_NET" ]; then
            echo "running smoke container on runner network: $RUNNER_NET"
            docker run -d --name shiny-smoke-test --network "$RUNNER_NET" hvalev/shiny-server-arm:ci-smoke
            APP_URL="http://shiny-smoke-test:3838/hello/"
          else
            docker run -d --name shiny-smoke-test hvalev/shiny-server-arm:ci-smoke
            IP=""
            for i in $(seq 1 30); do
              IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "bridge").IPAddress}}' shiny-smoke-test 2>/dev/null | awk '{print $1}')
              [ -n "$IP" ] && break
              sleep 2
            done
            if [ -z "$IP" ]; then
              echo "smoke test failed: container did not get an IP"
              docker logs --tail 50 shiny-smoke-test || true
              exit 1
            fi
            echo "container IP: $IP"
            APP_URL="http://$IP:3838/hello/"
          fi

          ok=0
          for i in $(seq 1 90); do
            # --max-time: never let a dead endpoint hang the job for hours
            if curl -sf --max-time 30 "$APP_URL" -o /tmp/smoke-hello.html; then
              ok=1
              break
            fi
            sleep 5
          done

          docker logs --tail 50 shiny-smoke-test || true

          if [ "$ok" -ne 1 ]; then
            echo "smoke test failed: /hello/ never responded"
            exit 1
          fi
          if grep -qi "It's Alive" /tmp/smoke-hello.html; then
            echo "smoke test passed: hello app is serving the expected page"
          else
            echo "smoke test failed: unexpected response from /hello/"
            head -c 2000 /tmp/smoke-hello.html
            exit 1
          fi
          docker rm -f shiny-smoke-test >/dev/null
